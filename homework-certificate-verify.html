<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071B3A"><title>POINTS | التحقق من شهادة الواجبات</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-functions-compat.js"></script>
<style>*{box-sizing:border-box;font-family:Tahoma,Arial}body{margin:0;padding:18px;background:linear-gradient(135deg,#dbeafe,#ede9fe);min-height:100vh;color:#172554}.wrap{max-width:760px;margin:auto}.card{background:#fff;border-radius:20px;padding:22px;margin:16px 0;box-shadow:0 7px 24px #17255414}h1{color:#4338ca;text-align:center}label{display:block;font-weight:bold;margin:14px 0 7px}input{width:100%;padding:14px;border:1px solid #cbd5e1;border-radius:11px;font-size:19px;text-align:center;letter-spacing:3px;direction:ltr}button{width:100%;padding:14px;border:0;border-radius:12px;background:linear-gradient(120deg,#4338ca,#7c3aed);color:white;font-size:17px;font-weight:bold;margin-top:14px;cursor:pointer}.notice{padding:13px;border-radius:12px;background:#eff6ff;color:#1e40af;margin-top:14px;line-height:1.8;white-space:pre-wrap}.error{background:#fef2f2;color:#991b1b}.success{background:#f0fdf4;color:#166534}.result{margin-top:16px;padding:18px;border:2px solid #86efac;border-radius:15px;background:#f0fdf4;line-height:2}.result.invalid{border-color:#fca5a5;background:#fef2f2}.muted{color:#64748b;font-size:13px}</style></head><body><main class="wrap">
<section class="card"><h1>🔎 التحقق من شهادة تقدير الواجبات المنزلية</h1><p style="text-align:center">أدخل كود التحقق المطبوع على الشهادة للتأكد من أنها صادرة من نظام بوينتس.</p>
<div id="loginBox"><label>البريد الإلكتروني للمعلم</label><input id="email" type="email" autocomplete="username" style="letter-spacing:normal;direction:ltr;text-align:left"><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password" style="letter-spacing:normal;direction:ltr;text-align:left"><button id="loginBtn">تسجيل الدخول</button></div>
<div id="verifyBox" style="display:none"><div class="muted" id="userLabel"></div><label>كود التحقق</label><input id="code" maxlength="12" placeholder="مثال: 1A2B3C4D5E6F"><button id="verifyBtn">التحقق من الشهادة</button><button id="logoutBtn" style="background:#64748b">تسجيل الخروج</button></div>
<div id="status" class="notice" style="display:none"></div><div id="result"></div></section></main>
<script>
const firebaseConfig={apiKey:"AIzaSyCAeHOVGUpG7WcPcUh0XtBvmTwLGdcBCJE",authDomain:"school-points-qatar.firebaseapp.com",projectId:"school-points-qatar",storageBucket:"school-points-qatar.firebasestorage.app",messagingSenderId:"689880020347",appId:"1:689880020347:web:24305b6f89ac3448acb9de"};
if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.firestore(),fn=firebase.app().functions("us-central1");
const $=id=>document.getElementById(id);
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function status(t,kind){$("status").style.display="block";$("status").className="notice "+(kind||"");$("status").textContent=t;}
auth.onAuthStateChanged(async user=>{if(!user){$("loginBox").style.display="block";$("verifyBox").style.display="none";return;}try{const snap=await db.collection("users").doc(user.uid).get();const p=snap.exists?snap.data()||{}:{};if(p.active!==true||p.approved!==true)throw new Error("الحساب غير نشط أو غير معتمد.");$("loginBox").style.display="none";$("verifyBox").style.display="block";$("userLabel").textContent="تم تسجيل الدخول: "+(p.teacherName||p.displayName||user.email||"المعلم");}catch(e){await auth.signOut();status(e.message||"تعذر التحقق من الحساب.","error");}});
$("loginBtn").onclick=async()=>{try{await auth.signInWithEmailAndPassword($("email").value.trim(),$("password").value);}catch(e){status(e.message||"تعذر تسجيل الدخول.","error");}};
$("logoutBtn").onclick=()=>auth.signOut();
$("verifyBtn").onclick=async()=>{const code=$("code").value.trim().toUpperCase();if(!/^[A-F0-9]{12}$/.test(code)){status("أدخل كودًا مكونًا من 12 خانة.","error");return;}$("verifyBtn").disabled=true;$("result").innerHTML="";status("⏳ جارٍ التحقق من السجل الرسمي...");try{const r=await fn.httpsCallable("verifyHomeworkCertificate")({verificationCode:code});const d=r.data||{};if(d.success!==true)throw new Error("لم يؤكد الخادم نتيجة التحقق.");if(!d.valid){status(d.message||"الشهادة غير صالحة.","error");$("result").innerHTML='<div class="result invalid"><b>❌ الشهادة غير معتمدة</b><br>'+esc(d.message||"لا يوجد سجل مطابق.")+'</div>';return;}const c=d.certificate||{};status(d.message||"الشهادة أصلية.","success");$("result").innerHTML='<div class="result"><h2 style="color:#166534;margin-top:0">✅ شهادة أصلية ومسجلة</h2><b>اسم الطالب:</b> '+esc(c.studentName)+'<br><b>الصف:</b> '+esc(c.studentClass)+'<br><b>مستوى الشهادة:</b> '+esc(c.tierTitle)+'<br><b>نقاط الواجبات:</b> '+Number(c.homeworkPoints||0).toLocaleString("ar-QA")+'<br><b>عدد الواجبات المعتمدة:</b> '+Number(c.homeworkAssignments||0).toLocaleString("ar-QA")+'<br><b>تاريخ الإصدار:</b> '+esc(c.issuedAtText)+'<br><b>كود التحقق:</b> <span dir="ltr">'+esc(c.verificationCode)+'</span><br><b>المعلم:</b> '+esc(c.teacherName)+'</div>';}catch(e){status(e.message||"تعذر التحقق من الشهادة.","error");}finally{$("verifyBtn").disabled=false;}};
</script></body></html>
